{% set name = "km3io" %}
{% set version = "1.2.6" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/km3io-{{ version }}.tar.gz
  sha256: 2e0dd3e88fab252dedb657dd89fd987ca81754846833b6eafcfc5df4ce5d3b3c

build:
  number: 0
  noarch: python
  entry_points:
    - KPrintTree=km3io.utils.kprinttree:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools_scm
  run:
    - awkward >=2
    - docopt
    - numba >=0.50
    - numpy >=2
    - python >=3.9
    - setuptools-scm
    - uproot >=5

test:
  imports:
    - km3io
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://git.km3net.de/km3py/km3io
  summary: KM3NeT I/O without ROOT
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tamasgal
